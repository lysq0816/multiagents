[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "after-sales-mas"
version = "0.6.0"
description = "Difficulty-routed multi-agent workflow for retail after-sales support"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic>=2.11,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/after_sales_agents"]

[tool.hatch.build.targets.wheel.force-include]
"policies/retail_policy_clauses.json" = "after_sales_agents/policy/retail_policy_clauses.json"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
